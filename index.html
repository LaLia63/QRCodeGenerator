<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <title>QR Code Generator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container d-flex justify-content-center">
      <div class="card p-4 text-center">
        <h3 class="fw-bold text-primary comic-font mb-4">QR Code Generator</h3>

        <div class="mb-3 text-start">
          <label for="url" class="fw-bold fs-5 text-primary comic-font">Enter URL:</label>
          <input type="text" id="url" class="form-control comic-font" placeholder="Enter URL..." />
          <p id="errorMsg" class="text-danger small mt-2"></p>
        </div>

        <button id="generateBtn" class="btn btn-blue mb-3 comic-font w-100">Generate</button>

        <div id="qrcode" class="text-center">
          <canvas id="qr" aria-label="QR code" role="img"></canvas>
          <p id="previewMsg" class="small mt-2 text-muted">QR code will appear here.</p>
          <button id="downloadBtn" class="btn-down comic-font">Download</button>
        </div>
      </div>
    </div>
  <script src="https://cdn.jsdelivr.net/npm/qrious@4.0.2/dist/qrious.min.js"></script>
    <script src="index.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
